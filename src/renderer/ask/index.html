<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>lolPing · Ask AI</title>
    <link rel="stylesheet" href="./ask.css" />
  </head>
  <body>
    <div class="card">
      <header class="head">
        <span class="spark"></span>
        <b id="title">Ask AI</b>
        <span class="model" id="model"></span>
        <button class="link" id="historyBtn" type="button">History</button>
        <button class="link" id="newChat" type="button">New chat</button>
        <button class="icon" id="close" type="button">✕</button>
      </header>
      <div class="shot" id="shotRow" hidden>
        <img id="shot" alt="" />
        <span class="shotInfo" id="shotInfo"></span>
      </div>
      <div class="notice" id="notice" hidden>
        <div>
          <b id="noticeTitle"></b>
          <span id="noticeBody"></span>
        </div>
        <button class="link" id="noticeAction" type="button" hidden></button>
      </div>
      <div class="thread" id="thread"></div>
      <div class="askRow">
        <textarea id="question" rows="2" spellcheck="false"></textarea>
        <button class="primary" id="send" type="button">Ask</button>
      </div>
      <footer class="foot">
        <div class="footRow">
          <span class="hint" id="hint"></span>
          <button class="link" id="copy" type="button" hidden>Copy</button>
        </div>
        <span class="note" id="note"></span>
      </footer>
      <div class="history" id="history" hidden>
        <div class="historyHead">
          <b id="historyTitle"></b>
          <button class="link" id="historyClear" type="button"></button>
          <button class="icon" id="historyClose" type="button">✕</button>
        </div>
        <div class="historyList" id="historyList"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
